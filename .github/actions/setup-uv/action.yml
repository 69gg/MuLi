name: Set up uv
description: Install uv from PyPI so CI does not depend on GitHub release assets.
inputs:
  python-version:
    description: Python version for the project environment
    required: false
    default: '3.13'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv from PyPI
      shell: bash
      run: >-
        python -m pip install --disable-pip-version-check --no-input
        --retries 5 --timeout 60 "uv==0.13.7"
    - name: Point uv at the selected interpreter
      shell: bash
      run: |
        set -euo pipefail
        echo "UV_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
        uv --version
        python --version

name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test --test-concurrency=1 --test-timeout=15000 tests/frontend/*.test.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=256
      - run: uv build
      - run: uv run python scripts/check_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
  tests:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Report SQLite runtime
        run: uv run python -c "import sqlite3, sys; print(sys.version); print('SQLite', sqlite3.sqlite_version)"
      - run: uv run pytest -q -o faulthandler_timeout=60 --basetemp="${{ runner.temp }}/muli-pytest"
      - name: Preserve synthetic channel recovery evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: channel-recovery-${{ matrix.os }}-${{ matrix.python }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/muli-pytest/channel-recovery*/channels.db
            ${{ runner.temp }}/muli-pytest/channel-recovery*/channels.db-wal
            ${{ runner.temp }}/muli-pytest/channel-recovery*/channels.db-shm
            ${{ runner.temp }}/muli-pytest/channel-recovery*/sqlite-diagnostics.json
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked --extra mcp --extra channels
      - run: uv run --extra mcp --extra channels pytest -q -o faulthandler_timeout=60 tests/test_mcp.py tests/test_channels.py

name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  linux-native:
    uses: ./.github/workflows/linux-native.yml
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test --test-concurrency=1 --test-timeout=15000 tests/frontend/*.test.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=256
      - run: uv build
      - run: uv run python scripts/check_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
  tests:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - os: macos-latest
            python: '3.12'
            shard: 1
            shards: 2
          - os: macos-latest
            python: '3.12'
            shard: 2
            shards: 2
          - os: macos-latest
            python: '3.13'
            shard: 1
            shards: 2
          - os: macos-latest
            python: '3.13'
            shard: 2
            shards: 2
          - os: ubuntu-latest
            python: '3.12'
            shard: 1
            shards: 3
          - os: ubuntu-latest
            python: '3.12'
            shard: 2
            shards: 3
          - os: ubuntu-latest
            python: '3.12'
            shard: 3
            shards: 3
          - os: ubuntu-latest
            python: '3.13'
            shard: 1
            shards: 3
          - os: ubuntu-latest
            python: '3.13'
            shard: 2
            shards: 3
          - os: ubuntu-latest
            python: '3.13'
            shard: 3
            shards: 3
          - os: windows-latest
            python: '3.12'
            shard: 1
            shards: 4
          - os: windows-latest
            python: '3.12'
            shard: 2
            shards: 4
          - os: windows-latest
            python: '3.12'
            shard: 3
            shards: 4
          - os: windows-latest
            python: '3.12'
            shard: 4
            shards: 4
          - os: windows-latest
            python: '3.13'
            shard: 1
            shards: 4
          - os: windows-latest
            python: '3.13'
            shard: 2
            shards: 4
          - os: windows-latest
            python: '3.13'
            shard: 3
            shards: 4
          - os: windows-latest
            python: '3.13'
            shard: 4
            shards: 4
    runs-on: ${{ matrix.os }}
    env:
      MULI_PREVIOUS_SOURCE_ROOT: ${{ github.workspace }}/.local-check-artifacts/previous-consumer
    steps:
      - uses: actions/checkout@v4
      - name: Check out the frozen recovery consumer
        uses: actions/checkout@v4
        with:
          repository: 69gg/MuLi
          ref: dff5772bec99e8127d1b926c147332bfd29fdc8c
          path: .local-check-artifacts/previous-consumer
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra channels
      - name: Install Windows PDF converter
        if: runner.os == 'Windows'
        id: pdf-msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        env:
          # 已核对固定提交中的内部开关，避开曾同步失败的重定向镜像。
          __SETUP_MSYS2_USE_MAIN_MIRROR_ONLY: 'true'
        with:
          msystem: UCRT64
          release: false
          update: true
          install: mingw-w64-ucrt-x86_64-poppler
      - name: Select Windows PDF converter
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MULI_PDF_MSYS2: ${{ steps.pdf-msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $converterDirectory = Join-Path $env:MULI_PDF_MSYS2 'ucrt64/bin'
          $converter = Join-Path $converterDirectory 'pdftotext.exe'
          if (-not (Test-Path -LiteralPath $converter -PathType Leaf)) {
            throw 'Poppler pdftotext was not installed'
          }
          $converterDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $converter -v
          if ($LASTEXITCODE -ne 0) {
            throw 'Poppler pdftotext version check failed'
          }
      - name: Report SQLite runtime
        run: uv run python -c "import sqlite3, sys; print(sys.version); print('SQLite', sqlite3.sqlite_version)"
      - name: Prepare Linux recovery filesystem fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/muli-managed-recovery.ext4"
          directory="$RUNNER_TEMP/muli-managed-recovery"
          truncate -s 64M "$image"
          mkfs.ext4 -q -F "$image"
          mkdir "$directory"
          sudo mount -t ext4 -o loop,nodev,nosuid,noatime "$image" "$directory"
          sudo chown "$(id -u):$(id -g)" "$directory"
          chmod 700 "$directory"
          findmnt --mountpoint "$directory" --output TARGET,FSTYPE,OPTIONS
          df -B1 "$directory"
          df -i "$directory"
          export MULI_MANAGED_TEST_ROOT="$directory"
          uv run python -c "import os; from pathlib import Path; from muli.platforms.filesystem_identity import verify_local_filesystems; verify_local_filesystems((Path(os.environ['MULI_MANAGED_TEST_ROOT']),))"
          printf 'MULI_MANAGED_TEST_ROOT=%s\n' "$directory" >> "$GITHUB_ENV"
      - name: Run disjoint suite partition
        run: uv run pytest -q --muli-ci-shard=${{ matrix.shard }} --muli-ci-shards=${{ matrix.shards }} --durations=20 -o faulthandler_timeout=60 --basetemp="${{ runner.temp }}/muli-pytest"
      - name: Release Linux recovery filesystem fixture
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/muli-managed-recovery"
          if mountpoint -q "$directory"; then
            sudo umount "$directory"
          fi
      - name: Preserve synthetic channel recovery evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: channel-recovery-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.shard || 'all' }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/muli-pytest/channel-recovery*/channels.db
            ${{ runner.temp }}/muli-pytest/channel-recovery*/channels.db-wal
            ${{ runner.temp }}/muli-pytest/channel-recovery*/channels.db-shm
            ${{ runner.temp }}/muli-pytest/channel-recovery*/sqlite-diagnostics.json
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked --extra mcp --extra channels
      - run: >-
          uv run --extra mcp --extra channels pytest -q -o faulthandler_timeout=60
          tests/test_mcp*.py tests/test_team_progress*.py tests/test_channels.py
  managed-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - name: Real user-manager retained-slot transactions
        shell: bash
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          unit="muli-native-envelope-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
          exec sudo --non-interactive systemd-run --system --quiet --collect --wait --pipe \
            --service-type=exec --expand-environment=no --unit="$unit" \
            --uid="$runner_uid" --gid="$runner_gid" --working-directory="$GITHUB_WORKSPACE" \
            --property=MemoryMax=1073741824 --property=MemorySwapMax=0 \
            --property=CPUQuota=100% --property=TasksMax=128 --property=OOMPolicy=kill \
            --property=RuntimeMaxSec=960 --property=TimeoutStopSec=2 \
            --property=Restart=no --property=KillMode=control-group --property=SendSIGKILL=yes \
            --property=LimitCORE=0 --property=UMask=0077 \
            --setenv="MULI_NATIVE_ENVELOPE_UNIT=$unit" \
            --setenv="MULI_NATIVE_ENVELOPE_UID=$runner_uid" \
            --setenv="MULI_NATIVE_ENVELOPE_GID=$runner_gid" \
            --setenv="GITHUB_RUN_ID=$GITHUB_RUN_ID" --setenv="GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" \
            --setenv=GITHUB_ACTIONS=true --setenv=RUNNER_OS=Linux --setenv="RUNNER_TEMP=$RUNNER_TEMP" \
            --setenv="HOME=$HOME" --setenv=PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            --setenv=LANG=C.UTF-8 --setenv=LC_ALL=C.UTF-8 \
            "$GITHUB_WORKSPACE/.venv/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/check_managed_native_ci.py" run "$RUNNER_TEMP/muli-managed-native-ci"
      - name: Release only this fixture's user and mounts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          unit="muli-native-envelope-cleanup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.service"
          exec sudo --non-interactive systemd-run --system --quiet --collect --wait --pipe \
            --service-type=exec --expand-environment=no --unit="$unit" \
            --uid="$runner_uid" --gid="$runner_gid" --working-directory="$GITHUB_WORKSPACE" \
            --property=MemoryMax=1073741824 --property=MemorySwapMax=0 \
            --property=CPUQuota=100% --property=TasksMax=128 --property=OOMPolicy=kill \
            --property=RuntimeMaxSec=240 --property=TimeoutStopSec=2 \
            --property=Restart=no --property=KillMode=control-group --property=SendSIGKILL=yes \
            --property=LimitCORE=0 --property=UMask=0077 \
            --setenv="MULI_NATIVE_ENVELOPE_UNIT=$unit" \
            --setenv="MULI_NATIVE_ENVELOPE_UID=$runner_uid" \
            --setenv="MULI_NATIVE_ENVELOPE_GID=$runner_gid" \
            --setenv="GITHUB_RUN_ID=$GITHUB_RUN_ID" --setenv="GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" \
            --setenv=GITHUB_ACTIONS=true --setenv=RUNNER_OS=Linux --setenv="RUNNER_TEMP=$RUNNER_TEMP" \
            --setenv="HOME=$HOME" --setenv=PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            --setenv=LANG=C.UTF-8 --setenv=LC_ALL=C.UTF-8 \
            "$GITHUB_WORKSPACE/.venv/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/check_managed_native_ci.py" cleanup "$RUNNER_TEMP/muli-managed-native-ci"
      - name: Preserve bounded native transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-native-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/muli-managed-native-ci/receipt.json
            ${{ runner.temp }}/muli-managed-native-ci/result.json

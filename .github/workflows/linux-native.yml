name: Linux native accessibility
on:
  push:
    branches: ['codex/linux-atspi-native-*']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: linux-native-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - name: Install disposable GTK and accessibility dependencies on the hosted runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y \
            python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core \
            libatk-adaptor dbus-x11 xvfb xauth
      - name: Check owned GTK journeys in a private session with verified resource limits
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/muli-atspi-runtime"
          install -d -m 700 "$runtime"
          sudo systemd-run --wait --pipe --collect --service-type=exec \
            --unit="muli-atspi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --uid="$(id -u)" --gid="$(id -g)" \
            --working-directory="$GITHUB_WORKSPACE" \
            --property=MemoryMax=805306368 --property=MemorySwapMax=0 \
            --property=OOMPolicy=kill --property=CPUQuota=50% \
            --property=TasksMax=96 --property=RuntimeMaxSec=125 \
            --property=TimeoutStopSec=5 --property=KillMode=control-group \
            --setenv=GITHUB_ACTIONS=true --setenv=RUNNER_OS=Linux \
            --setenv=MULI_ATSPI_NATIVE=1 --setenv=GDK_BACKEND=x11 \
            --setenv=GTK_MODULES=atk-bridge --setenv=NO_AT_BRIDGE=0 \
            --setenv=GSETTINGS_BACKEND=memory --setenv=LANG=C.UTF-8 \
            --setenv="XDG_RUNTIME_DIR=$runtime" \
            /usr/bin/timeout --signal=TERM --kill-after=5s 120s \
            /usr/bin/env -u AT_SPI_BUS_ADDRESS \
            /usr/bin/dbus-run-session -- \
            /usr/bin/xvfb-run --auto-servernum \
            --server-args='-screen 0 800x600x24 -nolisten tcp' \
            "$GITHUB_WORKSPACE/.venv/bin/python" -c '
          import os, runpy
          from pathlib import Path
          from scripts.check_local import MEMORY_BYTES, verify_group
          membership = Path("/proc/self/cgroup").read_text().strip()
          if not membership.startswith("0::/") or "\n" in membership:
              raise RuntimeError("A private unified cgroup is required")
          verify_group(Path("/sys/fs/cgroup") / membership.removeprefix("0::/"), MEMORY_BYTES, service=True)
          import sys
          sys.argv = ["pytest", "-q", "--tb=short", "-o", "faulthandler_timeout=60", "tests/test_atspi_native.py", "--basetemp=" + os.environ["XDG_RUNTIME_DIR"] + "/pytest"]
          runpy.run_module("pytest", run_name="__main__")'

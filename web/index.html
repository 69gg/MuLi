<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#edf4f6">
  <meta name="color-scheme" content="light dark">
  <title>沐璃</title>
  <link rel="icon" href="./assets/muli-icon.png" type="image/png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#message-input">跳到输入框</a>
  <section id="auth-gate" class="auth-gate" aria-label="登录沐璃" hidden><form id="login-form" class="login-form"><img src="./assets/muli-avatar.webp" alt="" width="64" height="64"><h1>沐璃</h1><label class="field"><span>访问密码</span><input id="login-password" type="password" autocomplete="current-password" required aria-label="访问密码"></label><p id="login-error" class="form-error" role="alert" hidden></p><button class="primary-button" type="submit">进入对话</button></form></section>
  <div class="app-shell">
    <main class="main-workspace" id="main-workspace">
      <header class="topbar">
        <button class="workspace-brand" type="button" data-view="chat" aria-label="返回沐璃对话"><img src="./assets/muli-avatar.webp" alt="" width="36" height="36"><span>沐璃<small>MuLi</small></span></button>
        <h1 id="page-title" class="sr-only">沐璃对话</h1>
        <div class="topbar-actions"><button class="model-indicator" type="button" data-action="model-settings"><span class="status-dot" id="model-dot"></span><span id="model-label">读取模型…</span><span data-icon="chevron-down"></span></button></div>
      </header>
      <div id="connection-banner" class="connection-banner" role="status" hidden><span data-icon="info"></span><span id="connection-banner-text"></span><button class="text-button" type="button" data-action="refresh">重试</button></div>
      <div class="workspace-body">
        <section class="primary-workspace">
          <div id="chat-view" class="chat-view">
            <div id="conversation-scroll" class="conversation-scroll">
              <div id="welcome" class="welcome">
                <img class="welcome-illustration" src="./assets/muli-empty.webp" alt="" fetchpriority="high" width="380" height="253">
                <div class="welcome-copy"><h2>沐璃</h2><p>从一件想做的事开始。</p></div>
              </div>
              <div id="messages" class="messages" aria-live="off"></div>
              <div id="approval-region" class="approval-region" aria-live="polite"></div>
              <div id="run-status" class="run-status" role="status" hidden></div>
            </div>
            <button id="scroll-bottom" class="scroll-bottom icon-button" type="button" data-action="scroll-bottom" aria-label="回到最新消息" hidden><span data-icon="arrow-down"></span></button>
            <div class="composer-area">
              <form id="composer" class="composer">
                <div id="voice-progress" class="voice-progress" role="status" hidden><span id="voice-status"></span><button id="voice-stop" type="button" class="text-button" data-action="voice-stop">停止并转写</button><button type="button" class="text-button" data-action="voice-cancel">取消</button></div>
                <section id="voice-draft" class="voice-draft" aria-label="待处理转写草稿" hidden><label for="voice-draft-text">转写草稿 · 你的输入已保留</label><textarea id="voice-draft-text" rows="3" maxlength="64000"></textarea><div><button type="button" class="text-button" data-action="voice-draft-append">追加到输入框</button><button type="button" class="text-button" data-action="voice-draft-dismiss">丢弃文字</button></div></section>
                <div id="composer-attachments" class="composer-attachments" aria-label="待发送附件" hidden></div>
                <label class="sr-only" for="message-input">消息</label><textarea id="message-input" name="message" rows="1" placeholder="和沐璃说说…" maxlength="64000" autofocus></textarea>
                <div class="composer-toolbar"><div class="composer-options"><button class="icon-button attach-button" type="button" data-action="attach-files" aria-label="添加文件" title="添加文件"><span data-icon="attachment"></span></button><button id="voice-button" class="icon-button" type="button" data-action="voice-record" aria-label="录音并转写为草稿" title="录音并转写为草稿" disabled><span data-icon="microphone"></span></button><input id="file-input" class="sr-only" type="file" multiple tabindex="-1" aria-label="上传文件"><label class="sr-only" for="mode-select">执行模式</label><select id="mode-select" aria-label="执行模式"><option value="ask">Ask · 逐次审批</option><option value="auto">Auto · 自动判断</option><option value="yolo">Yolo · 直接执行</option></select><span id="composer-context" class="composer-context" hidden></span></div><div class="composer-actions"><button id="stop-button" class="icon-button stop-button" type="button" data-action="stop" aria-label="停止任务" title="停止任务" hidden><span data-icon="stop"></span></button><button id="send-button" class="send-button" type="submit" aria-label="发送消息" disabled><span data-icon="arrow-up"></span></button></div></div>
              </form>
              <div class="composer-footnote"><span id="composer-status">正在连接沐璃</span><span class="keyboard-hint">Enter 发送<span>·</span>Shift + Enter 换行</span></div>
            </div>
          </div>
          <section id="management-shell" class="management-shell" aria-label="设置与管理" hidden>
            <div class="management-heading"><button type="button" class="text-button back-to-chat" data-view="chat"><span data-icon="arrow-left"></span>回到对话</button><div class="management-connection"><span id="connection-dot" class="status-dot"></span><span id="connection-label">连接工作台…</span><button class="icon-button" type="button" data-action="refresh" aria-label="重新连接"><span data-icon="refresh"></span></button></div></div>
            <nav class="management-nav" aria-label="管理页面"><button type="button" data-view="settings">设置<span id="settings-attention" class="attention-dot" hidden></span></button><button type="button" data-view="workflows">工作流</button><button type="button" data-view="team">团队</button><button type="button" data-view="memories">记忆</button><button type="button" data-view="notifications">通知<span id="notification-count" class="nav-count" hidden></span></button><button type="button" data-view="uploads">附件</button><button type="button" data-view="records">运行记录</button></nav>
            <div id="other-view" class="other-view"></div>
          </section>
        </section>
      </div>
    </main>
    <div class="workspace-controls" aria-label="工作台设置"><button id="theme-toggle" class="icon-button" type="button" data-action="toggle-theme" aria-label="切换深色" title="切换深色"><span data-icon="moon"></span></button><button id="settings-toggle" class="icon-button" type="button" data-action="open-settings" aria-label="设置与管理" title="设置与管理"><span data-icon="settings"></span><span id="inbox-attention" class="control-attention" hidden></span></button></div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <dialog id="app-dialog" class="app-dialog"><form id="dialog-form"><div class="dialog-heading"><h2 id="dialog-title"></h2><button class="icon-button" type="button" data-action="close-dialog" aria-label="关闭"><span data-icon="close"></span></button></div><div id="dialog-content" class="dialog-content"></div><p id="dialog-error" class="form-error" role="alert" hidden></p><div class="dialog-actions"><button class="secondary-button" type="button" data-action="close-dialog">取消</button><button id="dialog-submit" class="primary-button" type="submit">保存</button></div></form></dialog>
</body>
</html>

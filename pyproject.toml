[project]
name = "muli-agent"
version = "2.37.0"
description = "沐璃：事件驱动的本地数字生命与私人多 agent 助手"
authors = [{name = "Null", email = "pylindex@qq.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.119,<1", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "packaging>=25,<26", "pydantic>=2.12,<3", "pyyaml>=6.0.3,<7", "uvicorn>=0.38,<1"]

[project.scripts]
muli = "muli.__main__:main"
MuLi = "muli.__main__:main"

[project.urls]
Repository = "https://github.com/69gg/MuLi"
Documentation = "https://github.com/69gg/MuLi/blob/main/README.md"

[project.optional-dependencies]
mcp = ["fastmcp>=2.13,<3"]
channels = ["cryptography>=43,<48"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muli"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "muli/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "main.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/muli"]
strict = true
ignore_missing_imports = true
